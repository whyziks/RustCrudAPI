
services:
  db:
    image: postgres:17
    container_name: rust_tasks_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasks_user
      POSTGRES_PASSWORD: tasks_password
      POSTGRES_DB: tasks_db
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

